<title>Monkey Type Clone - Test your typing skills! ⌨️</title>
<style>
  :root {
    color-scheme: light dark;
    --green: #00b755;
    --yellow: #daaf38;
    --red: #ca4754;
    --black: #222;
    --gray: #999;
  }

  body {
    background: var(--black);
    font-family: Menlo, monospace;
    display: grid;
    font-size: 28px;
    place-content: center;
  }

  section {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-width: 900px;
    margin: auto;
    text-wrap: balance;
  }

  time {
    color: var(--yellow);
  }

  input {
    z-index: -999;
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    opacity: 0;
  }

  p {
    display: flex;
    flex-wrap: wrap;
    gap: 3px 8px;
    margin: 0;
  }

  letter {
    color: var(--gray);
    position: relative;

    &.active::before {
      content: "|";
      color: var(--yellow);
      font-size: 24px;
      position: absolute;
      left: -65%;
      animation: 1s blink infinite ease-in-out;
    }

    &.active.is-last::before {
      left: 65%;
    }

    &.correct {
      color: whitesmoke;
    }

    &.incorrect {
      color: var(--red);
    }
  }

  word {
    border-bottom: 1.5px solid transparent;
    transition: border-color 0.3s ease-in-out;

    &.marked {
      border-color: var(--red);
    }
  }

  @keyframes blink {
    0%,
    25% {
      opacity: 1;
    }

    75% {
      opacity: 0;
    }
  }

  #game {
    display: flex;
    flex-direction: column;
    margin-top: 12px;
  }

  #results {
    display: none;
  }

  h2 {
    font-weight: 400;
    opacity: 0.4;
    margin: 0;
    font-size: 32px;
  }

  h3 {
    font-weight: 400;
    margin: 0;
    font-size: 30px;
    color: var(--yellow);
  }

  button {
    background: transparent;
    border: 0;
    margin-top: 32px;
    padding: 8px;
    opacity: 0.4;
    display: inline-block;
    transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
    cursor: pointer;
    border-radius: 16px;

    &:hover {
      background: #444;
      opacity: 1;
      scale: 110%;
    }
  }
  #testConfig {
    position: relative;
    display: flex;
    flex-direction: row;
    place-content: center;
    border: #444 2px solid;
    border-radius: 12px;
    box-sizing: border-box;
    height: 40px;
    width: 280px;
    padding: 0;
    margin: auto;
    margin-top: 6px;
    margin-bottom: 6px;
    margin-right: auto;
    text-align: center;
  }
  .mode {
    display: flex;
    flex-direction: row;
    place-content: center;
    padding: 0;
    margin: auto;
    text-align: center;
    gap: 12px;
  }
  .time {
    display: flex;
    flex-direction: row;
    text-align: center;
    place-content: center;
    padding: 0;
    margin: auto;
    gap: 8px;
  }
  .textButton {
    display: inline-flex;
    color: var(--gray);
    flex-direction: row;
    place-content: center;
    margin: auto;
    padding: 0;
    padding-inline: 2px;
  }
  .textButton.active {
    color: var(--yellow);
    background-color: transparent;
    opacity: 1;
  }
  .textButton:hover {
    background-color: transparent;
  }
  .words {
    display: none;
    flex-direction: row;
    text-align: center;
    place-content: center;
    padding: 0;
    margin: auto;
    gap: 8px;
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    background: var(--black);
    border-bottom: 1px solid #333;
    position: sticky;
    top: 0;
    z-index: 100;
    width: 100%;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 24px;
    font-weight: 600;
    color: var(--yellow);
  }

  .logo-icon {
    background: var(--yellow);
    color: var(--black);
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-weight: 700;
    font-size: 24px;
  }

  .profile-btn {
    background: transparent;
    border: 2px solid #444;
    border-radius: 50%;
    width: 45px;
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    padding: 0;
    margin: 0;
    opacity: 1;
    position: relative;
  }

  .profile-btn:hover {
    background: #444;
    border-color: var(--yellow);
    transform: scale(1.05);
  }

  .profile-icon {
    font-size: 22px;
    color: var(--gray);
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .profile-btn:hover .profile-icon {
    color: var(--yellow);
  }

  /* Modal */
  #profileModal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.3s ease;
  }

  #profileModal.show {
    display: flex;
  }

  .modal-content {
    background: var(--black);
    border: 2px solid #444;
    border-radius: 16px;
    padding: 40px;
    max-width: 500px;
    width: 90%;
    position: relative;
    animation: slideUp 0.3s ease;
  }

  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
  }

  .modal-title {
    font-size: 28px;
    font-weight: 600;
    color: var(--yellow);
    margin: 0;
  }

  .close-btn {
    background: transparent;
    border: none;
    font-size: 32px;
    color: var(--gray);
    cursor: pointer;
    padding: 0;
    margin: 0;
    opacity: 1;
    line-height: 1;
    width: auto;
    height: auto;
  }

  .close-btn:hover {
    color: var(--red);
    transform: none;
    background: transparent;
  }

  .profile-section {
    margin-bottom: 25px;
  }

  .profile-label {
    font-size: 14px;
    color: var(--gray);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    display: block;
  }

  .profile-value {
    font-size: 20px;
    color: whitesmoke;
    font-weight: 500;
  }

  .profile-input {
    background: #333;
    border: 2px solid #444;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 18px;
    color: whitesmoke;
    font-family: inherit;
    width: 100%;
    box-sizing: border-box;
    transition: border-color 0.3s ease;
  }

  .profile-input:focus {
    outline: none;
    border-color: var(--yellow);
  }

  .edit-btn,
  .save-btn {
    background: var(--yellow);
    color: var(--black);
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-top: 10px;
    opacity: 1;
  }

  .edit-btn:hover,
  .save-btn:hover {
    background: #c9a030;
    transform: translateY(-2px);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 20px;
  }

  .stat-card {
    background: #2a2a2a;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #444;
  }

  .stat-label {
    font-size: 12px;
    color: var(--gray);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .stat-value {
    font-size: 24px;
    color: var(--yellow);
    font-weight: 600;
  }

  .config-display {
    background: #2a2a2a;
    padding: 15px;
    border-radius: 8px;
    border: 1px solid #444;
    margin-top: 10px;
  }

  .config-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #333;
  }

  .config-item:last-child {
    border-bottom: none;
  }

  .config-key {
    color: var(--gray);
    font-size: 14px;
  }

  .config-value {
    color: whitesmoke;
    font-weight: 500;
  }

  #game-container {
    height: 100vh;
    position: relative;
  }

  .config-select {
    background: #333;
    border: 2px solid #444;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 16px;
    color: whitesmoke;
    font-family: inherit;
    cursor: pointer;
    transition: border-color 0.3s ease;
    min-width: 80px;
  }

  .config-select:focus {
    outline: none;
    border-color: var(--yellow);
  }

  .config-select option {
    background: #333;
    color: whitesmoke;
  }

  .config-edit-section {
    margin-top: 15px;
  }

  .config-controls {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 10px;
  }

  .apply-config-btn {
    background: var(--yellow);
    color: var(--black);
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    opacity: 1;
  }

  .apply-config-btn:hover {
    background: #c9a030;
    transform: translateY(-2px);
  }
</style>

<body>
  <main id="game-container">
    <header>
      <div class="logo">
        <span class="logo-icon">T</span>
        <span>TypeFaster</span>
      </div>
      <button class="profile-btn" id="profileBtn">
        <span class="profile-icon">⚙️</span>
      </button>
    </header>

    <!-- Profile Modal -->
    <div id="profileModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title">Profile</h2>
          <button class="close-btn" id="closeModal">&times;</button>
        </div>

        <div class="profile-section">
          <label class="profile-label">Name</label>
          <div id="nameDisplay">
            <span class="profile-value" id="displayName">You</span>
            <button class="edit-btn" id="editNameBtn">Edit</button>
          </div>
          <div id="nameEdit" style="display: none">
            <input
              type="text"
              class="profile-input"
              id="nameInput"
              placeholder="Enter your name"
              maxlength="20"
            />
            <button class="save-btn" id="saveNameBtn">Save</button>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Record</div>
            <div class="stat-value" id="profileRecord">0</div>
            <div style="font-size: 12px; color: var(--gray); margin-top: 4px">
              WPM
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Time Played</div>
            <div class="stat-value" id="profileTime">0</div>
            <div style="font-size: 12px; color: var(--gray); margin-top: 4px">
              minutes
            </div>
          </div>
        </div>

        <div class="profile-section" style="margin-top: 30px">
          <label class="profile-label">Configuration</label>
          <div class="config-display">
            <div class="config-item">
              <span class="config-key">Mode:</span>
              <span class="config-value" id="profileMode">time</span>
            </div>
            <div class="config-item">
              <span class="config-key">Time:</span>
              <span class="config-value" id="profileTimeConfig">30s</span>
            </div>
            <div class="config-item">
              <span class="config-key">Words:</span>
              <span class="config-value" id="profileWordsConfig">25</span>
            </div>
          </div>

          <div class="config-edit-section">
            <button class="edit-btn" id="editConfigBtn">
              Edit Configuration
            </button>

            <div id="configEdit" style="display: none">
              <div class="config-controls">
                <label style="color: var(--gray); font-size: 14px">Mode:</label>
                <select class="config-select" id="modeSelect">
                  <option value="time">Time</option>
                  <option value="words">Words</option>
                </select>
              </div>

              <div class="config-controls">
                <label style="color: var(--gray); font-size: 14px"
                  >Time (seconds):</label
                >
                <select class="config-select" id="timeSelect">
                  <option value="15">15</option>
                  <option value="30" selected>30</option>
                  <option value="60">60</option>
                  <option value="120">120</option>
                </select>
              </div>

              <div class="config-controls">
                <label style="color: var(--gray); font-size: 14px"
                  >Words:</label
                >
                <select class="config-select" id="wordsSelect">
                  <option value="10">10</option>
                  <option value="25" selected>25</option>
                  <option value="50">50</option>
                  <option value="100">100</option>
                </select>
              </div>

              <button class="apply-config-btn" id="applyConfigBtn">
                Apply Changes
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <section id="game">
      <div id="testConfig">
        <div class="mode">
          <button class="textButton active" mode="time" id="btnTime">
            <i class="fas fa-fw fa-clock"></i>
            time
          </button>
          <button class="textButton" mode="words" id="btnWords">
            <i class="fas fa-fw fa-font"></i>
            words
          </button>
        </div>
        <div class="time" id="timeConfig">
          <button class="textButton" timeconfig="15">
            <span>15</span>
          </button>
          <button class="textButton active" timeconfig="30">
            <span>30</span>
          </button>
          <button class="textButton" timeconfig="60">
            <span>60</span>
          </button>
          <button class="textButton" timeconfig="120">
            <span>120</span>
          </button>
        </div>
        <div class="words" id="wordsConfig">
          <button class="textButton" wordcount="10"><span>10</span></button>
          <button class="textButton" wordcount="25"><span>25</span></button>
          <button class="textButton" wordcount="50"><span>50</span></button>
          <button class="textButton" wordcount="100">
            <span>100</span>
          </button>
          <button class="textButton" wordcount="custom">
            <i class="fas fa-fw fa-tools"></i>
          </button>
        </div>
      </div>
      <time></time>
      <p></p>
      <input />
    </section>
    <section id="results">
      <h2>record</h2>
      <h3 id="results-record"></h3>
      <h2>wpm</h2>
      <h3 id="results-wpm"></h3>

      <h2>accuracy</h2>
      <h3 id="results-accuracy"></h3>

      <button id="reload-button">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path
            d="M19.933 13.041a8 8 0 1 1 -9.925 -8.788c3.899 -1 7.935 1.007 9.425 4.747"
          />
          <path d="M20 4v5h-5" />
        </svg>
      </button>
    </section>
  </main>
</body>

<script type="module">
  import { words as INITIAL_WORDS } from "./words.js";
  import { config } from "./config.js";

  // Obtener configuración guardada o usar valores por defecto
  let optionTime =
    window.localStorage.getItem("time") ?? config.time.toString();
  let optionWords =
    window.localStorage.getItem("words") ?? config.words.toString();
  let currentMode = window.localStorage.getItem("mode") ?? "time";
  let userName = window.localStorage.getItem("userName") ?? "You";
  let totalTimePlayed =
    Number(window.localStorage.getItem("totalTimePlayed")) ?? 0;

  const $timeConfig = document.querySelector("#timeConfig");
  const $wordsConfig = document.querySelector("#wordsConfig");
  const $time = document.querySelector("time");
  const $paragraph = document.querySelector("p");
  const $game = document.querySelector("#game");
  const $input = $game.querySelector("input"); // Input del juego específicamente
  const $results = document.querySelector("#results");
  const $wpm = $results.querySelector("#results-wpm");
  const $record = $results.querySelector("#results-record");
  const $accuracy = $results.querySelector("#results-accuracy");
  const $button = document.querySelector("#reload-button");
  const $btnTime = document.querySelector("#btnTime");
  const $btnWords = document.querySelector("#btnWords");

  let INITIAL_TIME = Number(optionTime);
  let words = [];
  let currentTime = INITIAL_TIME;
  let playing;
  let gameStartTime = 0;
  let justReloaded = false;

  initConfigMenu();
  initGame();
  initEvents();
  initProfile();
  function initConfigMenu() {
    // Restaurar el modo guardado
    if (currentMode === "words") {
      $wordsConfig.style.display = "flex";
      $timeConfig.style.display = "none";
      $btnWords.classList.add("active");
      $btnTime.classList.remove("active");
    } else {
      $timeConfig.style.display = "flex";
      $wordsConfig.style.display = "none";
      $btnTime.classList.add("active");
      $btnWords.classList.remove("active");
    }

    // Marcar el botón de tiempo activo
    $timeConfig.querySelectorAll("button").forEach((btn) => {
      if (btn.querySelector("span").innerHTML === optionTime) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    });

    // Marcar el botón de palabras activo
    $wordsConfig.querySelectorAll("button").forEach((btn) => {
      if (!btn.querySelector("span")) return;
      if (btn.querySelector("span").innerHTML === optionWords) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    });

    // Cambiar a modo tiempo
    $btnTime.addEventListener("click", (event) => {
      currentMode = "time";
      window.localStorage.setItem("mode", "time");
      $timeConfig.style.display = "flex";
      $btnTime.classList.add("active");
      $wordsConfig.style.display = "none";
      $btnWords.classList.remove("active");
    });

    // Cambiar a modo palabras
    $btnWords.addEventListener("click", (event) => {
      currentMode = "words";
      window.localStorage.setItem("mode", "words");
      $wordsConfig.style.display = "flex";
      $btnWords.classList.add("active");
      $timeConfig.style.display = "none";
      $btnTime.classList.remove("active");
    });

    // Configurar botones de tiempo
    $timeConfig.querySelectorAll("button").forEach((button) =>
      button.addEventListener("click", (event) => {
        console.log("Click en botón de tiempo detectado");
        // Obtener el botón clickeado (puede ser el button o un elemento hijo)
        const clickedButton = event.currentTarget;
        const timeConfig = clickedButton.querySelector("span")?.innerHTML;
        console.log("Valor de tiempo:", timeConfig);

        if (timeConfig) {
          // Cambiar automáticamente a modo "time"
          currentMode = "time";
          window.localStorage.setItem("mode", "time");
          console.log("Modo cambiado a time");

          // Actualizar botones time/words visualmente
          $btnTime.classList.add("active");
          $btnWords.classList.remove("active");
          $timeConfig.style.display = "flex";
          $wordsConfig.style.display = "none";

          const btn = $timeConfig.querySelectorAll("button");
          btn.forEach((btn) => {
            if (btn.querySelector("span").innerHTML === timeConfig) {
              btn.classList.add("active");
              window.localStorage.setItem("time", timeConfig);
              INITIAL_TIME = Number(timeConfig);
              optionTime = timeConfig;
              initGame();
            } else {
              btn.classList.remove("active");
            }
          });
        }
      })
    );

    // Configurar botones de palabras
    $wordsConfig.querySelectorAll("button").forEach((button) =>
      button.addEventListener("click", (event) => {
        // Obtener el botón clickeado (puede ser el button o un elemento hijo)
        const clickedButton = event.currentTarget;
        const wordConfig = clickedButton.querySelector("span")?.innerHTML;

        if (wordConfig) {
          // Cambiar automáticamente a modo "words"
          currentMode = "words";
          window.localStorage.setItem("mode", "words");

          // Actualizar botones time/words visualmente
          $btnWords.classList.add("active");
          $btnTime.classList.remove("active");
          $wordsConfig.style.display = "flex";
          $timeConfig.style.display = "none";

          const btn = $wordsConfig.querySelectorAll("button");
          btn.forEach((btn) => {
            if (!btn.querySelector("span")) return;
            if (btn.querySelector("span").innerHTML === wordConfig) {
              btn.classList.add("active");
              window.localStorage.setItem("words", wordConfig);
              optionWords = wordConfig;
              initGame();
            } else {
              btn.classList.remove("active");
            }
          });
        }
      })
    );
  }
  function initGame() {
    $game.style.display = "flex";
    $results.style.display = "none";
    $input.value = "";

    playing = false;
    justReloaded = true;

    // Resetear el flag después de un delay más largo
    setTimeout(() => {
      justReloaded = false;
    }, 200);

    // Hacer focus después de un delay adicional
    setTimeout(() => {
      $input.focus();
    }, 250);

    // Actualizar INITIAL_TIME según el modo
    INITIAL_TIME = Number(optionTime);

    // Determinar cuántas palabras usar según el modo
    const wordCount =
      currentMode === "words" ? Number(optionWords) : Number(optionWords);

    words = INITIAL_WORDS.toSorted(() => Math.random() - 0.5).slice(
      0,
      wordCount
    );
    currentTime = INITIAL_TIME;

    // Siempre mostrar el tiempo
    $time.textContent = currentTime;

    $paragraph.innerHTML = words
      .map((word, index) => {
        const letters = word.split("");

        return `<word>
        ${letters.map((letter) => `<letter>${letter}</letter>`).join("")}
      </word>
      `;
      })
      .join("");

    const $firstWord = $paragraph.querySelector("word");
    $firstWord.classList.add("active");
    $firstWord.querySelector("letter").classList.add("active");
  }

  function initEvents() {
    document.addEventListener("keydown", (e) => {
      // No hacer nada si acabamos de recargar
      if (justReloaded) {
        return;
      }

      // No hacer focus si el modal está abierto
      const $profileModal = document.getElementById("profileModal");
      const isModalOpen = $profileModal.classList.contains("show");

      // Solo bloquear si estamos escribiendo en inputs del modal (no el input del juego)
      const isTypingInModalInput =
        e.target !== $input &&
        (e.target.tagName === "INPUT" ||
          e.target.tagName === "TEXTAREA" ||
          e.target.tagName === "SELECT");

      if (isModalOpen ?? isTypingInModalInput) {
        return;
      }

      // Lista de teclas que NO deben iniciar el juego
      const ignoredKeys = [
        "Shift",
        "Control",
        "Alt",
        "Meta",
        "CapsLock",
        "Tab",
        "Escape",
        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight",
        "F1",
        "F2",
        "F3",
        "F4",
        "F5",
        "F6",
        "F7",
        "F8",
        "F9",
        "F10",
        "F11",
        "F12",
        "Home",
        "End",
        "PageUp",
        "PageDown",
        "Insert",
        "Delete",
        "NumLock",
        "ScrollLock",
        "Pause",
        "ContextMenu",
      ];

      // No iniciar el juego con teclas especiales
      if (ignoredKeys.includes(e.key)) {
        return;
      }

      $input.focus();
    });

    // Iniciar el juego solo cuando se escribe en el input del juego
    $input.addEventListener("keydown", (e) => {
      // No iniciar si acabamos de recargar
      if (justReloaded) {
        return;
      }

      // Lista de teclas que NO deben iniciar el juego
      const ignoredKeys = [
        "Shift",
        "Control",
        "Alt",
        "Meta",
        "CapsLock",
        "Tab",
        "Escape",
        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight",
        "F1",
        "F2",
        "F3",
        "F4",
        "F5",
        "F6",
        "F7",
        "F8",
        "F9",
        "F10",
        "F11",
        "F12",
        "Home",
        "End",
        "PageUp",
        "PageDown",
        "Insert",
        "Delete",
        "NumLock",
        "ScrollLock",
        "Pause",
        "ContextMenu",
      ];

      // No iniciar el juego con teclas especiales
      if (ignoredKeys.includes(e.key)) {
        return;
      }

      if (!playing) {
        playing = true;
        gameStartTime = Date.now();

        // Iniciar timer (cuenta regresiva siempre)
        const intervalId = setInterval(() => {
          currentTime--;
          $time.textContent = currentTime;

          if (currentTime === 0) {
            clearInterval(intervalId);
            gameOver();
          }
        }, 1000);
      }
      onKeyDown(e);
    });

    $input.addEventListener("keyup", onKeyUp);
    $button.addEventListener("click", initGame);
  }

  function initProfile() {
    const $profileBtn = document.getElementById("profileBtn");
    const $profileModal = document.getElementById("profileModal");
    const $closeModal = document.getElementById("closeModal");
    const $editNameBtn = document.getElementById("editNameBtn");
    const $saveNameBtn = document.getElementById("saveNameBtn");
    const $nameInput = document.getElementById("nameInput");
    const $nameDisplay = document.getElementById("nameDisplay");
    const $nameEdit = document.getElementById("nameEdit");
    const $displayName = document.getElementById("displayName");
    const $editConfigBtn = document.getElementById("editConfigBtn");
    const $configEdit = document.getElementById("configEdit");
    const $applyConfigBtn = document.getElementById("applyConfigBtn");
    const $modeSelect = document.getElementById("modeSelect");
    const $timeSelect = document.getElementById("timeSelect");
    const $wordsSelect = document.getElementById("wordsSelect");

    // Mostrar nombre guardado
    $displayName.textContent = userName;

    // Abrir modal
    $profileBtn.addEventListener("click", () => {
      updateProfileModal();
      $profileModal.classList.add("show");
    });

    // Cerrar modal
    $closeModal.addEventListener("click", () => {
      $profileModal.classList.remove("show");
    });

    // Cerrar al hacer click fuera del modal
    $profileModal.addEventListener("click", (e) => {
      if (e.target === $profileModal) {
        $profileModal.classList.remove("show");
      }
    });

    // Editar nombre
    $editNameBtn.addEventListener("click", () => {
      $nameInput.value = userName;
      $nameDisplay.style.display = "none";
      $nameEdit.style.display = "block";
      $nameInput.focus();
    });

    // Guardar nombre
    $saveNameBtn.addEventListener("click", () => {
      const newName = $nameInput.value.trim() ?? "You";
      userName = newName;
      window.localStorage.setItem("userName", userName);
      $displayName.textContent = userName;
      $nameDisplay.style.display = "block";
      $nameEdit.style.display = "none";
    });

    // Guardar con Enter
    $nameInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        $saveNameBtn.click();
      }
    });

    // Editar configuración
    $editConfigBtn.addEventListener("click", () => {
      // Establecer valores actuales en los selects
      $modeSelect.value = currentMode;
      $timeSelect.value = optionTime;
      $wordsSelect.value = optionWords;

      $editConfigBtn.style.display = "none";
      $configEdit.style.display = "block";
    });

    // Aplicar cambios de configuración
    $applyConfigBtn.addEventListener("click", () => {
      const newMode = $modeSelect.value;
      const newTime = $timeSelect.value;
      const newWords = $wordsSelect.value;

      // Actualizar variables globales
      currentMode = newMode;
      optionTime = newTime;
      optionWords = newWords;

      // Guardar en localStorage
      window.localStorage.setItem("mode", newMode);
      window.localStorage.setItem("time", newTime);
      window.localStorage.setItem("words", newWords);

      // Actualizar UI del juego (botones time/words)
      if (currentMode === "words") {
        $wordsConfig.style.display = "flex";
        $timeConfig.style.display = "none";
        $btnWords.classList.add("active");
        $btnTime.classList.remove("active");
      } else {
        $timeConfig.style.display = "flex";
        $wordsConfig.style.display = "none";
        $btnTime.classList.add("active");
        $btnWords.classList.remove("active");
      }

      // Actualizar botones activos
      updateGameConfig();

      // Actualizar modal
      updateProfileModal();

      // Ocultar edición
      $editConfigBtn.style.display = "inline-block";
      $configEdit.style.display = "none";

      // Reiniciar juego con nueva configuración
      initGame();
    });
  }

  function updateProfileModal() {
    const record = window.localStorage.getItem("record") ?? "0";
    const timePlayed = Math.round(totalTimePlayed / 60); // convertir a minutos

    document.getElementById("profileRecord").textContent = record;
    document.getElementById("profileTime").textContent = timePlayed;
    document.getElementById("profileMode").textContent = currentMode;
    document.getElementById("profileTimeConfig").textContent = optionTime + "s";
    document.getElementById("profileWordsConfig").textContent = optionWords;
  }

  function updateGameConfig() {
    // Actualizar botones de tiempo
    const timeButtons = $timeConfig.querySelectorAll("button");
    timeButtons.forEach((btn) => {
      const timeValue = btn.getAttribute("timeconfig");
      if (timeValue === optionTime) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    });

    // Actualizar botones de palabras
    const wordButtons = $wordsConfig.querySelectorAll("button");
    wordButtons.forEach((btn) => {
      const wordValue = btn.getAttribute("wordcount");
      if (wordValue === optionWords) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    });

    // Actualizar INITIAL_TIME
    INITIAL_TIME = Number(optionTime);
  }

  function onKeyDown(event) {
    const $currentWord = $paragraph.querySelector("word.active");
    const $currentLetter = $currentWord.querySelector("letter.active");

    const { key } = event;
    if (key === " ") {
      event.preventDefault();

      const $nextWord = $currentWord.nextElementSibling;
      const $nextLetter = $nextWord.querySelector("letter");

      $currentWord.classList.remove("active", "marked");
      $currentLetter.classList.remove("active");

      $nextWord.classList.add("active");
      $nextLetter.classList.add("active");

      $input.value = "";

      const hasMissedLetters =
        $currentWord.querySelectorAll("letter:not(.correct)").length > 0;

      const classToAdd = hasMissedLetters ? "marked" : "correct";
      $currentWord.classList.add(classToAdd);

      return;
    }

    if (key === "Backspace") {
      const $prevWord = $currentWord.previousElementSibling;
      const $prevLetter = $currentLetter.previousElementSibling;

      if (!$prevWord && !$prevLetter) {
        event.preventDefault();
        return;
      }

      const $wordMarked = $paragraph.querySelector("word.marked");
      if ($wordMarked && !$prevLetter) {
        event.preventDefault();
        $prevWord.classList.remove("marked");
        $prevWord.classList.add("active");

        const $letterToGo = $prevWord.querySelector("letter:last-child");

        $currentLetter.classList.remove("active");
        $letterToGo.classList.add("active");

        $input.value = [
          ...$prevWord.querySelectorAll("letter.correct, letter.incorrect"),
        ]
          .map(($el) => {
            return $el.classList.contains("correct") ? $el.innerText : "*";
          })
          .join("");
      }
    }
  }

  function onKeyUp() {
    const $currentWord = $paragraph.querySelector("word.active");
    const $currentLetter = $currentWord.querySelector("letter.active");

    const currentWord = $currentWord.innerText.trim();
    $input.maxLength = currentWord.length;

    const $allLetters = $currentWord.querySelectorAll("letter");

    $allLetters.forEach(($letter) =>
      $letter.classList.remove("correct", "incorrect")
    );

    $input.value.split("").forEach((char, index) => {
      const $letter = $allLetters[index];
      const letterToCheck = currentWord[index];

      const isCorrect = char === letterToCheck;
      const letterClass = isCorrect ? "correct" : "incorrect";
      $letter.classList.add(letterClass);
    });

    $currentLetter.classList.remove("active", "is-last");
    const inputLength = $input.value.length;
    const $nextActiveLetter = $allLetters[inputLength];

    if ($nextActiveLetter) {
      $nextActiveLetter.classList.add("active");
    } else {
      $currentLetter.classList.add("active", "is-last");

      const $nextWord = $currentWord.nextElementSibling;
      if (!$nextWord) {
        gameOver();
      }
    }
  }

  function gameOver() {
    $game.style.display = "none";
    $results.style.display = "flex";

    // Calcular tiempo jugado
    const gameEndTime = Date.now();
    const sessionTime = Math.round((gameEndTime - gameStartTime) / 1000); // en segundos
    totalTimePlayed += sessionTime;
    window.localStorage.setItem("totalTimePlayed", totalTimePlayed.toString());

    const correctWords = $paragraph.querySelectorAll("word.correct").length;
    const correctLetter = $paragraph.querySelectorAll("letter.correct").length;
    const incorrectLetter =
      $paragraph.querySelectorAll("letter.incorrect").length;

    const totalLetters = correctLetter + incorrectLetter;

    const accuracy =
      totalLetters > 0 ? (correctLetter / totalLetters) * 100 : 0;

    const wpm = Math.round((correctWords * 60) / INITIAL_TIME);
    $wpm.textContent = wpm;

    // Obtener el récord actual SIEMPRE desde localStorage (no usar variable cacheada)
    const currentRecord = Number(window.localStorage.getItem("record")) ?? 0;

    // Comparar y actualizar el récord si es necesario
    if (wpm > currentRecord) {
      window.localStorage.setItem("record", wpm.toString());
      $record.textContent = wpm;
    } else {
      $record.textContent = currentRecord;
    }

    $accuracy.textContent = `${accuracy.toFixed(2)}%`;
  }
</script>
